<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <!-- Glider co-design: PPO updates until the final curriculum stage per frozen wing (course report, Table 3, Stage 3 reached: mean ± sd over 5 seeds). Redrawn for the site (docs/MEDIA.md). Ink on transparent; sky = the CEM winner. -->
  <title id="t">Training updates until the controller reaches the final curriculum stage, per wing design</title>
  <desc id="d">Mean PPO updates to reach the final curriculum stage over five seeds, lower is faster: NACA 4412 baseline 285 (±48), random direction 252 (±55, 11.6% faster), co-designed wing 208 (±22, 27.1% faster), a random sample from the co-design distribution 200 (±21, 29.9% faster), CEM winner 200 (±18, 29.7% faster).</desc>
