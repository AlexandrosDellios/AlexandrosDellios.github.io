<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t">
  <!--
    Uno sim-to-real: TILE crop of poster.svg (home grid only). The 5-zone table split from the
    poster's left half, scaled up, without the small sub-labels that are illegible at tile size.
    The bottom ~19% stays quiet for the tile's chips (bottom-left) and outlined "UNO" word.
    Rendered to poster-tile.png with scripts/media/render_svg.py (docs/MEDIA.md §2.4).
  -->
  <title id="t">Diagram: an Uno table split into four rotated hand zones and a center pile</title>
  <style>
    .sans { font-family: 'Geist', 'Geist Variable', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .zl   { font-size: 30px; font-weight: 700; }
  </style>

  <rect width="1200" height="900" fill="#F4EFE6"/>

  <!-- 480 px table from the poster, scaled 1.458 = 700 px, centred, top 30 -->
  <g transform="translate(250 30) scale(1.4583)">
    <rect width="480" height="480" fill="#EBE4D8" stroke="#151412" stroke-width="2"/>
    <rect class="zone zone-p3" x="120" y="0" width="240" height="144" fill="#1e88e5" fill-opacity="0.18" stroke="#1e88e5" stroke-width="3"/>
    <text x="240" y="82" text-anchor="middle" class="sans zl" fill="#1565C0">P3</text>
    <rect class="zone zone-p4" x="0" y="120" width="144" height="312" fill="#f4c430" fill-opacity="0.22" stroke="#f4c430" stroke-width="3"/>
    <text x="72" y="286" text-anchor="middle" class="sans zl" fill="#8A6A00">P4</text>
    <rect class="zone zone-p2" x="336" y="120" width="144" height="288" fill="#2fa84f" fill-opacity="0.18" stroke="#2fa84f" stroke-width="3"/>
    <text x="408" y="274" text-anchor="middle" class="sans zl" fill="#1E7A3A">P2</text>
    <rect class="zone zone-p1" x="120" y="360" width="264" height="120" fill="#e5383b" fill-opacity="0.16" stroke="#e5383b" stroke-width="3"/>
    <text x="252" y="430" text-anchor="middle" class="sans zl" fill="#B3262A">P1</text>
    <rect class="zone zone-ctr" x="192" y="192" width="96" height="144" fill="#F4EFE6" stroke="#151412" stroke-width="2"/>
    <text x="240" y="274" text-anchor="middle" class="sans zl" fill="#151412">CTR</text>
  </g>
</svg>
