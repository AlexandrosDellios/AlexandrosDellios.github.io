  <title id="t">CPG gait phase offsets: trot, walk, pace, bound</title>
  <desc id="d">Top view of the quadruped for four gaits with each leg's phase offset as a fraction of the oscillator cycle, and a one-cycle timeline where mustard bars mark the swing phase of each leg. Trot: LF 0, RF 0.5, LH 0.5, RH 0. Walk: LF 0, RF 0.5, LH 0.75, RH 0.25. Pace: LF 0, RF 0.5, LH 0, RH 0.5. Bound: LF 0.5, RF 0.5, LH 0, RH 0.</desc>
