    .ph { font-size: 14px; font-weight: 500; }
    .lab { font-size: 11px; letter-spacing: 1px; fill-opacity: .6; }
    .ax { font-size: 10.5px; fill-opacity: .6; }
    .note { font-size: 10.5px; letter-spacing: 1.2px; fill-opacity: .6; }
    .body { fill: none; stroke: #151412; stroke-width: 1.75; }
    .leg { stroke: #151412; stroke-width: 1.75; stroke-linecap: round; }
    .track { stroke: #151412; stroke-opacity: .3; stroke-width: 1.5; }
    .tick { stroke: #151412; stroke-opacity: .45; stroke-width: 1; }
    .swing { fill: #E2A814; }
